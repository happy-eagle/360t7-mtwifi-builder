name: build-360t7-54

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC_REPO: "https://github.com/hanwckf/immortalwrt-mt798x"
  SRC_BRANCH: "openwrt-21.02"
  # 固定到与 NX30 Pro 5.4 相同的提交，避免未来重编漂移
  SRC_COMMIT: "740103d655bcee6da7bc3b49b1cfdfdee4cd5bb6"
  FEED_PACKAGES_COMMIT: "e09f3c7d1903cfe7f523e209ab3ec778013ba309"
  FEED_LUCI_COMMIT: "5829eabba50ec0afa17d2ee486bc90dc15180c34"
  FEED_ROUTING_COMMIT: "a9e43101bb726070cbf81b6225fc0625f4a4a5e5"
  FEED_TELEPHONY_COMMIT: "920fbc5c0a2e4badf51bceff42e9a1e3eb693462"
  DEVICE: "mt7981-360-t7-108M"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-distutils rsync swig unzip zlib1g-dev file wget time \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone source (hanwckf 5.4, pinned commit)
        run: |
          git clone -b "$SRC_BRANCH" --single-branch --filter=blob:none "$SRC_REPO" openwrt
          cd openwrt
          git checkout --detach "$SRC_COMMIT"
          echo "源代码已固定到:"
          git log -1 --format='commit %H  %ci  %s'
          [ "$(git rev-parse HEAD)" = "$SRC_COMMIT" ] || \
            { echo "::error::源码 commit 固定失败"; exit 1; }
          echo "--- 内核版本 ---"
          grep -E 'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' target/linux/mediatek/Makefile
          echo "--- 360T7 设备定义 ---"
          grep -nE '^(define Device/|TARGET_DEVICES \+=).*360-t7' \
            target/linux/mediatek/image/mt7981.mk || \
            { echo "::error::找不到 360T7 设备定义"; exit 1; }
          echo "--- 确认 108M UBI 布局 ---"
          DTS="target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-360-t7-108M.dts"
          grep -q 'label = "ubi";' "$DTS" || \
            { echo "::error::$DTS 没有 ubi 分区"; exit 1; }
          grep -q 'reg = <0x580000 0x6c00000>' "$DTS" || \
            { echo "::error::$DTS 的 ubi 不是 0x580000 + 0x6c00000（108M）"; exit 1; }
          echo "ubi 分区: 0x580000 + 0x6c00000 = 108 MiB（与当前 24.10 固件一致）"

      - name: Update feeds (pinned commits)
        run: |
          cd openwrt
          # 先用 upstream 分支完成 clone/update，再显式 checkout 固定 SHA。
          # 避免不同 git 版本对 URL^SHA 写法的解析差异，并确保 21.02 对象在本地。
          cat > feeds.conf.default <<EOF
          src-git-full packages https://github.com/immortalwrt/packages.git;openwrt-21.02
          src-git-full luci https://github.com/immortalwrt/luci.git;openwrt-21.02
          src-git-full routing https://github.com/openwrt/routing.git;openwrt-21.02
          src-git-full telephony https://github.com/openwrt/telephony.git;openwrt-21.02
          EOF
          echo "===== feeds 配置 ====="
          cat feeds.conf.default
          ./scripts/feeds update -a
          for feed in packages luci routing telephony; do
            case "$feed" in
              packages)  want="$FEED_PACKAGES_COMMIT" ;;
              luci)      want="$FEED_LUCI_COMMIT" ;;
              routing)   want="$FEED_ROUTING_COMMIT" ;;
              telephony) want="$FEED_TELEPHONY_COMMIT" ;;
            esac
            # 确保 21.02 分支对象一定在本地，再切到固定 SHA
            git -C "feeds/$feed" fetch origin \
              "+refs/heads/openwrt-21.02:refs/remotes/origin/openwrt-21.02"
            git -C "feeds/$feed" checkout --detach "$want"
            got="$(git -C "feeds/$feed" rev-parse HEAD)"
            echo "$feed @ $got"
            git -C "feeds/$feed" log -1 --format='  %ci  %s'
            [ "$got" = "$want" ] || { echo "::error::$feed commit 不匹配: $got != $want"; exit 1; }
          done
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/prepare-config-54-360t7.sh"
          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/verify-config-54-360t7.sh"
          echo "===== 关键开关 ====="
          grep -E '^CONFIG_(PACKAGE_kmod-mt_wifi|PACKAGE_kmod-mediatek_hnat|MTK_CHIP_MT7981|MTK_FIRST_IF_MT7981|MTK_WARP_V2|MTK_MT_WIFI_DRIVER_VERSION_)=' .config || true
          echo "===== UPnP ====="
          grep -E '^CONFIG_PACKAGE_(miniupnpd|luci-app-upnp|luci-i18n-upnp-zh-cn)=' .config || true
          echo "===== 主题（argon 必须缺席） ====="
          grep -E '^CONFIG_PACKAGE_luci-theme-(bootstrap|argon)=' .config || true
          echo "===== 开源驱动必须缺席 ====="
          grep -E '^CONFIG_PACKAGE_kmod-mt7915e' .config || echo "kmod-mt7915e: 未启用（正确）"

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          : > build.log
          echo "=== 全量并行编译 -j$(($(nproc)+1)) ==="
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd openwrt
          echo "===== 产物目录 ====="
          ls -lh bin/targets/mediatek/mt7981/ || true
          find bin/targets/mediatek/mt7981 -maxdepth 1 -type f \
               \( -iname "*360-t7*" -o -iname "*360t7*" -o -name "sha256sums" \
                  -o -name "*.manifest" -o -name "config.buildinfo" \
                  -o -name "feeds.buildinfo" -o -name "profiles.json" \
                  -o -name "version.buildinfo" \) \
               -exec cp {} ../out/ \;
          cd ..
          echo "===== 收集到的产物 ====="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "::error::没有产出任何固件"; exit 1; }

          echo "===== sha256sums 自校验 ====="
          (cd out && sha256sum -c sha256sums) || \
            { echo "::error::sha256sums 校验失败，Release 前终止"; exit 1; }

          FACTORY="$(ls out/*factory* 2>/dev/null | head -1 || true)"
          [ -n "$FACTORY" ] || { echo "::error::没有 factory.bin —— 原厂恢复页无法刷机"; exit 1; }
          MAGIC="$(head -c 4 "$FACTORY" | od -An -tx1 | tr -d ' \n')"
          echo "factory 镜像: $FACTORY"
          echo "头部 magic: $MAGIC"
          [ "$MAGIC" = "55424923" ] || \
            { echo "::error::factory 不是 UBI 格式（期望 55424923 = 'UBI#'，实际 $MAGIC）"; exit 1; }
          SZ=$(stat -c %s "$FACTORY")
          echo "大小: $SZ 字节 ($((SZ/1024/1024)) MiB)"
          [ "$SZ" -le 113246208 ] || \
            { echo "::error::factory 超过 108M ubi 分区上限 (113246208 字节)"; exit 1; }
          echo "factory 镜像格式与尺寸校验通过"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-360t7-54
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-21.02-mtwifi-360t7-108M
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-5.4-$(date +%Y%m%d)-${{ github.run_number }}-360t7"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "$TAG  360T7 (5.4 / mt_wifi / UPnP / 108M UBI)" \
            --notes "源码: $SRC_REPO @ $SRC_BRANCH
          源码 commit: $SRC_COMMIT
          feeds commit:
            packages=$FEED_PACKAGES_COMMIT
            luci=$FEED_LUCI_COMMIT
            routing=$FEED_ROUTING_COMMIT
            telephony=$FEED_TELEPHONY_COMMIT
          设备: $DEVICE (MT7981B, 108M UBI 布局)
          内核: 5.4 (21.02)
          无线: MTK 闭源 mt_wifi 7.6.7.3-mt7981 + WARP v2 + HNAT
          插件: 仅追加 UPnP (miniupnpd, iptables/firewall3)
          主题: 标准 bootstrap（不含 argon）
          构建: $(date -u +'%Y-%m-%d %H:%M UTC')
          校验: CI 已执行 sha256sum -c sha256sums
          注意: 仅适用于 108M UBI 布局的 360T7；原厂 36M 布局请另选 mt7981-360-t7。"
