name: build-360t7

on:
  workflow_dispatch:
    inputs:
      device:
        description: "device id（默认 qihoo_360t7）"
        required: false
        default: "qihoo_360t7"
      variant:
        description: "固件变体"
        required: true
        default: "plain"
        type: choice
        options:
          - plain
          - openclash

permissions:
  contents: write

env:
  SRC_REPO: "https://github.com/padavanonly/immortalwrt-mt798x-24.10"
  SRC_BRANCH: "openwrt-24.10-6.6"
  DEVICE: ${{ inputs.device || 'qihoo_360t7' }}
  VARIANT: ${{ inputs.variant || 'plain' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-distutils rsync swig unzip zlib1g-dev file wget time \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone source
        run: |
          git clone -b "$SRC_BRANCH" --single-branch --filter=blob:none "$SRC_REPO" openwrt
          cd openwrt
          git log -1 --format='commit %H  %ci  %s'
          echo "--- 源码树里 360 相关的设备定义 ---"
          grep -nE '^(define Device/|TARGET_DEVICES \+=).*360' \
            target/linux/mediatek/image/filogic.mk || echo "（没找到，后面会失败）"

      - name: Patch device definition (UBI factory image)
        run: |
          cd openwrt
          python3 "$GITHUB_WORKSPACE/scripts/patch-filogic-mk.py" \
            target/linux/mediatek/image/filogic.mk "$DEVICE" 108

      - name: Bundle clash core into rootfs
        if: env.VARIANT == 'openclash'
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/fetch-core.sh" files/etc/openclash/core meta
          echo "===== files/ 树 ====="
          find files -type f -exec ls -l {} \;

      - name: Add OpenClash feed
        if: env.VARIANT == 'openclash'
        run: |
          cd openwrt
          grep -q 'src-git openclash' feeds.conf.default || \
            echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/prepare-config.sh" "$DEVICE"
          if [ "$VARIANT" = "openclash" ]; then
            bash "$GITHUB_WORKSPACE/scripts/add-openclash.sh"
          fi
          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/verify-config.sh" "$DEVICE"
          echo "===== 关键开关 ====="
          grep -E '^CONFIG_(PACKAGE_kmod-mt_wifi|PACKAGE_kmod-mediatek_hnat|PACKAGE_kmod-warp|MTK_MT7981_NEW_FW|MTK_CHIP_MT7981|MTK_WARP_V2)=' .config || true
          grep -E '^CONFIG_PACKAGE_kmod-mt7915e' .config || echo "kmod-mt7915e: 未启用（正确，闭源驱动不装它）"

          if [ "$VARIANT" = "openclash" ]; then
            echo "===== OpenClash 校验 ====="
            for sym in luci-app-openclash dnsmasq-full kmod-tun kmod-inet-diag kmod-nft-tproxy luci-compat ruby ip-full; do
              if grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
                echo "[ OK ] ${sym}"
              else
                echo "::error::OpenClash 依赖缺失: ${sym} 未启用"
                exit 1
              fi
            done
            if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
              echo "::error::dnsmasq 与 dnsmasq-full 同时启用，会冲突"
              exit 1
            fi
            echo "[ OK ] dnsmasq 已让位给 dnsmasq-full"

            echo "===== 内置内核校验 ====="
            CORE="files/etc/openclash/core/clash_meta"
            [ -f "$CORE" ] || { echo "::error::内核未放入 $CORE"; exit 1; }
            CMAGIC=$(od -An -tx1 -j0 -N4 "$CORE" | tr -d ' \n')
            CMACH=$(od -An -tx1 -j18 -N2 "$CORE" | tr -d ' \n')
            CSZ=$(stat -c %s "$CORE")
            echo "  $CORE  $((CSZ/1024/1024)) MB  magic=$CMAGIC machine=$CMACH"
            [ "$CMAGIC" = "7f454c46" ] || { echo "::error::内核不是 ELF"; exit 1; }
            [ "$CMACH" = "b700" ] || { echo "::error::内核架构不是 AArch64（machine=$CMACH）"; exit 1; }
            echo "[ OK ] 内核为 AArch64，将随固件打包"
          fi

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          : > build.log

          # ruby 的构建系统并行不安全，直接 -j 会随机失败。
          # 先单线程把它编掉，后面的并行 make 会跳过已完成的包。
          RUBY_PKG=""
          if [ -d feeds/packages/lang/ruby ]; then
            RUBY_PKG="package/feeds/packages/ruby"
          elif [ -d package/lang/ruby ]; then
            RUBY_PKG="package/lang/ruby"
          fi
          if [ -n "$RUBY_PKG" ] && grep -q '^CONFIG_PACKAGE_ruby=y' .config; then
            echo "=== 预编译 ruby（-j1，规避并行 race）: $RUBY_PKG ==="
            make -j1 "$RUBY_PKG/compile" V=s 2>&1 | tee -a build.log | tail -n 60
            echo "=== ruby 预编译完成 ==="
          else
            echo "=== 未选中 ruby，跳过预编译 ==="
          fi

          # 不要用 -j1 兜底：单线程重编整个 OpenWrt 要 4 小时以上，
          # 失败就该红叉并把日志交出来，而不是把 40 分钟的活拖成半天。
          echo "=== 并行编译其余部分 -j$(($(nproc)+1)) ==="
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd openwrt
          ls -lh bin/targets/mediatek/filogic/ || true
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
               \( -name "*360*" -o -name "sha256sums" -o -name "*.manifest" \) \
               -exec cp {} ../out/ \;
          cd ..
          echo "===== 收集到的产物 ====="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "::error::没有产出任何固件"; exit 1; }

          echo "===== factory 镜像校验 ====="
          FACTORY="$(ls out/*factory* 2>/dev/null | head -1 || true)"
          if [ -z "$FACTORY" ]; then
            echo "::error::没有 factory.bin —— uboot 恢复页无法刷机"
            exit 1
          fi
          MAGIC="$(head -c 4 "$FACTORY" | od -An -tx1 | tr -d ' \n')"
          echo "factory 镜像: $FACTORY"
          echo "头部 magic: $MAGIC"
          if [ "$MAGIC" != "55424923" ]; then
            echo "::error::factory 镜像不是 UBI 格式（期望 55424923 = 'UBI#'，实际 $MAGIC）"
            exit 1
          fi
          SZ=$(stat -c %s "$FACTORY")
          echo "大小: $SZ 字节 ($((SZ/1024/1024)) MiB)"
          if [ "$SZ" -gt 113246208 ]; then
            echo "::error::factory 镜像超过 ubi 分区 0x6c00000 (113246208 字节)"
            exit 1
          fi
          echo "factory 镜像格式与尺寸校验通过"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10-mtwifi-${{ env.DEVICE }}-${{ env.VARIANT }}
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +%Y%m%d)-${{ github.run_number }}-${{ env.VARIANT }}"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "$TAG  ${{ env.DEVICE }}  (mt_wifi 7.6.6.1, ${{ env.VARIANT }})" \
            --notes "源码: $SRC_REPO @ $SRC_BRANCH
          设备: ${{ env.DEVICE }}
          变体: ${{ env.VARIANT }}
          无线: MTK 闭源 mt_wifi 7.6.6.1 + WARP v2 + HNAT
          构建: $(date -u +'%Y-%m-%d %H:%M UTC')"
