name: build-360t7

on:
  workflow_dispatch:
    inputs:
      device:
        description: "device id（默认 qihoo_360t7）"
        required: false
        default: "qihoo_360t7"
      variant:
        description: "固件变体"
        required: true
        default: "plain"
        type: choice
        options:
          - plain
          - openclash

permissions:
  contents: write

env:
  SRC_REPO: "https://github.com/padavanonly/immortalwrt-mt798x-24.10"
  SRC_BRANCH: "openwrt-24.10-6.6"
  DEVICE: ${{ inputs.device || 'qihoo_360t7' }}
  VARIANT: ${{ inputs.variant || 'plain' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-distutils rsync swig unzip zlib1g-dev file wget time \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone source
        run: |
          git clone -b "$SRC_BRANCH" --single-branch --filter=blob:none "$SRC_REPO" openwrt
          cd openwrt
          git log -1 --format='commit %H  %ci  %s'
          echo "--- 源码树里 360 相关的设备定义 ---"
          grep -nE '^(define Device/|TARGET_DEVICES \+=).*360' \
            target/linux/mediatek/image/filogic.mk || echo "（没找到，后面会失败）"

      - name: Patch device definition (UBI factory image)
        run: |
          cd openwrt
          python3 "$GITHUB_WORKSPACE/scripts/patch-filogic-mk.py" \
            target/linux/mediatek/image/filogic.mk "$DEVICE" 108

      - name: Add OpenClash feed
        if: env.VARIANT == 'openclash'
        run: |
          cd openwrt
          grep -q 'src-git openclash' feeds.conf.default || \
            echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
          echo "===== feeds.conf.default ====="
          cat feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/prepare-config.sh" "$DEVICE"
          if [ "$VARIANT" = "openclash" ]; then
            bash "$GITHUB_WORKSPACE/scripts/add-openclash.sh"
          fi
          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/verify-config.sh" "$DEVICE"
          echo "===== 关键开关 ====="
          grep -E '^CONFIG_(PACKAGE_kmod-mt_wifi|PACKAGE_kmod-mediatek_hnat|PACKAGE_kmod-warp|MTK_MT7981_NEW_FW|MTK_CHIP_MT7981|MTK_WARP_V2)=' .config || true
          grep -E '^CONFIG_PACKAGE_kmod-mt7915e' .config || echo "kmod-mt7915e: 未启用（正确，闭源驱动不装它）"

          if [ "$VARIANT" = "openclash" ]; then
            echo "===== OpenClash 校验 ====="
            for sym in luci-app-openclash dnsmasq-full kmod-tun kmod-inet-diag kmod-nft-tproxy luci-compat ruby ip-full; do
              if grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
                echo "[ OK ] ${sym}"
              else
                echo "::error::OpenClash 依赖缺失: ${sym} 未启用"
                exit 1
              fi
            done
            if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
              echo "::error::dnsmasq 与 dnsmasq-full 同时启用，会冲突"
              exit 1
            fi
            echo "[ OK ] dnsmasq 已让位给 dnsmasq-full"
          fi

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" 2>&1 | tee build.log || {
            echo "=== 并行编译失败，转单线程重试 ==="
            make -j1 V=s 2>&1 | tee -a build.log | tail -n 300
          }

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd openwrt
          ls -lh bin/targets/mediatek/filogic/ || true
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
               \( -name "*360*" -o -name "sha256sums" -o -name "*.manifest" \) \
               -exec cp {} ../out/ \;
          cd ..
          echo "===== 收集到的产物 ====="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "::error::没有产出任何固件"; exit 1; }

          echo "===== factory 镜像校验 ====="
          FACTORY="$(ls out/*factory* 2>/dev/null | head -1 || true)"
          if [ -z "$FACTORY" ]; then
            echo "::error::没有 factory.bin —— uboot 恢复页无法刷机"
            exit 1
          fi
          MAGIC="$(head -c 4 "$FACTORY" | od -An -tx1 | tr -d ' \n')"
          echo "factory 镜像: $FACTORY"
          echo "头部 magic: $MAGIC"
          if [ "$MAGIC" != "55424923" ]; then
            echo "::error::factory 镜像不是 UBI 格式（期望 55424923 = 'UBI#'，实际 $MAGIC）"
            exit 1
          fi
          SZ=$(stat -c %s "$FACTORY")
          echo "大小: $SZ 字节 ($((SZ/1024/1024)) MiB)"
          if [ "$SZ" -gt 113246208 ]; then
            echo "::error::factory 镜像超过 ubi 分区 0x6c00000 (113246208 字节)"
            exit 1
          fi
          echo "factory 镜像格式与尺寸校验通过"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10-mtwifi-${{ env.DEVICE }}-${{ env.VARIANT }}
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-$(date +%Y%m%d)-${{ github.run_number }}-${{ env.VARIANT }}"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "$TAG  ${{ env.DEVICE }}  (mt_wifi 7.6.6.1, ${{ env.VARIANT }})" \
            --notes "源码: $SRC_REPO @ $SRC_BRANCH
          设备: ${{ env.DEVICE }}
          变体: ${{ env.VARIANT }}
          无线: MTK 闭源 mt_wifi 7.6.6.1 + WARP v2 + HNAT
          构建: $(date -u +'%Y-%m-%d %H:%M UTC')"
