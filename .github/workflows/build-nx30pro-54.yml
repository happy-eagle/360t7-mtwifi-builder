name: build-nx30pro-54

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC_REPO: "https://github.com/hanwckf/immortalwrt-mt798x"
  SRC_BRANCH: "openwrt-21.02"
  DEVICE: "h3c_nx30pro"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-distutils rsync swig unzip zlib1g-dev file wget time \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone source (hanwckf 5.4)
        run: |
          git clone -b "$SRC_BRANCH" --single-branch --filter=blob:none "$SRC_REPO" openwrt
          cd openwrt
          git log -1 --format='commit %H  %ci  %s'
          echo "--- 内核版本 ---"
          grep -E 'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' target/linux/mediatek/Makefile
          echo "--- NX30 Pro 设备定义 ---"
          grep -nE '^(define Device/|TARGET_DEVICES \+=).*nx30' \
            target/linux/mediatek/image/mt7981.mk || { echo "::error::找不到 h3c_nx30pro 设备定义"; exit 1; }

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/prepare-config-54.sh" "$DEVICE"
          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/verify-config-54.sh" "$DEVICE"
          echo "===== 关键开关 ====="
          grep -E '^CONFIG_(PACKAGE_kmod-mt_wifi|PACKAGE_kmod-mediatek_hnat|MTK_CHIP_MT7981|MTK_FIRST_IF_MT7981|MTK_WARP_V2|MTK_MT_WIFI_DRIVER_VERSION_)=' .config || true
          echo "===== UPnP ====="
          grep -E '^CONFIG_PACKAGE_(miniupnpd|luci-app-upnp|luci-i18n-upnp-zh-cn)=' .config || true
          echo "===== 开源驱动必须缺席 ====="
          grep -E '^CONFIG_PACKAGE_kmod-mt7915e' .config || echo "kmod-mt7915e: 未启用（正确）"

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          : > build.log
          echo "=== 全量并行编译 -j$(($(nproc)+1)) ==="
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd openwrt
          echo "===== 产物目录 ====="
          ls -lh bin/targets/mediatek/mt7981/ || true
          find bin/targets/mediatek/mt7981 -maxdepth 1 -type f \
               \( -iname "*nx30*" -o -name "sha256sums" -o -name "*.manifest" \) \
               -exec cp {} ../out/ \;
          cd ..
          echo "===== 收集到的产物 ====="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "::error::没有产出任何固件"; exit 1; }

          FACTORY="$(ls out/*factory* 2>/dev/null | head -1 || true)"
          [ -n "$FACTORY" ] || { echo "::error::没有 factory.bin —— 原厂恢复页无法刷机"; exit 1; }
          MAGIC="$(head -c 4 "$FACTORY" | od -An -tx1 | tr -d ' \n')"
          echo "factory 镜像: $FACTORY"
          echo "头部 magic: $MAGIC"
          [ "$MAGIC" = "55424923" ] || \
            { echo "::error::factory 不是 UBI 格式（期望 55424923 = 'UBI#'，实际 $MAGIC）"; exit 1; }
          SZ=$(stat -c %s "$FACTORY")
          echo "大小: $SZ 字节 ($((SZ/1024/1024)) MiB)"
          [ "$SZ" -le 67108864 ] || \
            { echo "::error::factory 超过 ubi 分区 64MB (67108864 字节)"; exit 1; }
          echo "factory 镜像格式与尺寸校验通过"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-nx30pro-54
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-21.02-mtwifi-${{ env.DEVICE }}
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-5.4-$(date +%Y%m%d)-${{ github.run_number }}-nx30pro"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "$TAG  H3C NX30 Pro (5.4 / mt_wifi / UPnP)" \
            --notes "源码: $SRC_REPO @ $SRC_BRANCH
          设备: $DEVICE (MT7981B)
          内核: 5.4 (21.02)
          无线: MTK 闭源 mt_wifi 7.6.7.3-mt7981 + WARP v2 + HNAT
          网络: UPnP (miniupnpd, iptables/firewall3)
          构建: $(date -u +'%Y-%m-%d %H:%M UTC')
          注意: 原厂 U-Boot/NMBM 机器请确认镜像布局后再刷。"
