name: build-nx30pro-66

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC_REPO: "https://github.com/padavanonly/immortalwrt-mt798x-24.10"
  SRC_BRANCH: "openwrt-24.10-6.6"
  # 固定源码与 feeds commit，避免未来重编漂移
  SRC_COMMIT: "ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8"
  FEED_PACKAGES_COMMIT: "e6b6f0a1f46e72d2c4973dac3909dca63f347a94"
  FEED_LUCI_COMMIT: "cc142cd196d425d9f14f9c18f072913730b642ce"
  FEED_ROUTING_COMMIT: "6310a34d521da859ad577ab734afef85304c25d8"
  FEED_TELEPHONY_COMMIT: "695f4f4a733dfaf10922d24bf9dbdfd509b8a6d4"
  DEVICE: "h3c_magic-nx30-pro-nmbm"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-dev python3-setuptools \
            python3-distutils rsync swig unzip zlib1g-dev file wget time \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone source (padavanonly 6.6, pinned commit)
        run: |
          git clone -b "$SRC_BRANCH" --single-branch --filter=blob:none "$SRC_REPO" openwrt
          cd openwrt
          git checkout --detach "$SRC_COMMIT"
          echo "源代码已固定到:"
          git log -1 --format='commit %H  %ci  %s'
          [ "$(git rev-parse HEAD)" = "$SRC_COMMIT" ] || \
            { echo "::error::源码 commit 固定失败"; exit 1; }
          echo "--- 内核版本 ---"
          grep -E 'KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER' target/linux/mediatek/Makefile
          echo "--- NX30 Pro 设备定义 ---"
          grep -nE '^(define Device/|TARGET_DEVICES \+=).*nx30' \
            target/linux/mediatek/image/filogic.mk || \
            { echo "::error::找不到 NX30 Pro 设备定义"; exit 1; }
          echo "--- 确认 NMBM DTS ---"
          DTS="target/linux/mediatek/dts/mt7981b-h3c-magic-nx30-pro-nmbm.dts"
          grep -q 'mediatek,nmbm;' "$DTS" || \
            { echo "::error::$DTS 没有 mediatek,nmbm"; exit 1; }
          echo "NMBM 布局确认 OK"

      - name: Update feeds (pinned commits)
        run: |
          cd openwrt
          # 先用 upstream 分支完成 clone/update，再显式 checkout 固定 SHA。
          # 避免不同 git 版本对 URL^SHA 写法的解析差异，并确保 24.10 对象在本地。
          cat > feeds.conf.default <<EOF
          src-git-full packages https://github.com/immortalwrt/packages.git;openwrt-24.10
          src-git-full luci https://github.com/immortalwrt/luci.git;openwrt-24.10
          src-git-full routing https://github.com/openwrt/routing.git;openwrt-24.10
          src-git-full telephony https://github.com/openwrt/telephony.git;openwrt-24.10
          EOF
          echo "===== feeds 配置 ====="
          cat feeds.conf.default
          ./scripts/feeds update -a
          for feed in packages luci routing telephony; do
            case "$feed" in
              packages)  want="$FEED_PACKAGES_COMMIT" ;;
              luci)      want="$FEED_LUCI_COMMIT" ;;
              routing)   want="$FEED_ROUTING_COMMIT" ;;
              telephony) want="$FEED_TELEPHONY_COMMIT" ;;
            esac
            # 确保 24.10 分支对象一定在本地，再切到固定 SHA
            git -C "feeds/$feed" fetch origin \
              "+refs/heads/openwrt-24.10:refs/remotes/origin/openwrt-24.10"
            git -C "feeds/$feed" checkout --detach "$want"
            got="$(git -C "feeds/$feed" rev-parse HEAD)"
            echo "$feed @ $got"
            git -C "feeds/$feed" log -1 --format='  %ci  %s'
            [ "$got" = "$want" ] || { echo "::error::$feed commit 不匹配: $got != $want"; exit 1; }
          done
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/prepare-config-66-nx30pro.sh"
          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          bash "$GITHUB_WORKSPACE/scripts/verify-config-66-nx30pro.sh"
          echo "===== 关键开关 ====="
          grep -E '^CONFIG_(PACKAGE_kmod-mt_wifi|PACKAGE_kmod-mediatek_hnat|MTK_CHIP_MT7981|MTK_MT7981_NEW_FW|MTK_WARP_V2|MTK_MT_WIFI_DRIVER_VERSION_)=' .config || true
          echo "===== UPnP ====="
          grep -E '^CONFIG_PACKAGE_(miniupnpd-nftables|luci-app-upnp|luci-i18n-upnp-zh-cn)=' .config || true
          echo "===== 主题（argon 必须缺席） ====="
          grep -E '^CONFIG_PACKAGE_luci-theme-(bootstrap|bootstrap-mod|argon)=' .config || true
          echo "===== 开源驱动必须缺席 ====="
          grep -E '^CONFIG_PACKAGE_(kmod-mt7915e|kmod-mt7981-firmware|mt7981-wo-firmware)' .config || echo "开源驱动: 未启用（正确）"

      - name: Download packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          set -o pipefail
          cd openwrt
          : > build.log
          echo "=== 全量并行编译 -j$(($(nproc)+1)) ==="
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee -a build.log

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd openwrt
          echo "===== 产物目录 ====="
          ls -lh bin/targets/mediatek/filogic/ || true
          find bin/targets/mediatek/filogic -maxdepth 1 -type f \
               \( -iname "*nx30*" -o -name "sha256sums" -o -name "*.manifest" \
                  -o -name "config.buildinfo" -o -name "feeds.buildinfo" \
                  -o -name "profiles.json" -o -name "version.buildinfo" \) \
               -exec cp {} ../out/ \;
          cd ..
          echo "===== 收集到的产物 ====="
          ls -lh out/
          test -n "$(ls -A out)" || { echo "::error::没有产出任何固件"; exit 1; }

          echo "===== sha256sums 自校验 ====="
          # sha256sums 还列出 5 个 bl2.bin（源码 ARTIFACTS，位于 staging 目录），
          # 不在 bin/targets 里、也不随固件发布。用 --ignore-missing 跳过它们，
          # 只校验真正收集到的镜像与 buildinfo。
          (cd out && sha256sum -c sha256sums --ignore-missing) || \
            { echo "::error::sha256sums 校验失败，Release 前终止"; exit 1; }

          FACTORY="$(ls out/*factory* 2>/dev/null | head -1 || true)"
          [ -n "$FACTORY" ] || { echo "::error::没有 factory.bin —— 原厂恢复页无法刷机"; exit 1; }
          MAGIC="$(head -c 4 "$FACTORY" | od -An -tx1 | tr -d ' \n')"
          echo "factory 镜像: $FACTORY"
          echo "头部 magic: $MAGIC"
          [ "$MAGIC" = "55424923" ] || \
            { echo "::error::factory 不是 UBI 格式（期望 55424923 = 'UBI#'，实际 $MAGIC）"; exit 1; }
          SZ=$(stat -c %s "$FACTORY")
          echo "大小: $SZ 字节 ($((SZ/1024/1024)) MiB)"
          [ "$SZ" -le 67108864 ] || \
            { echo "::error::factory 超过 64M ubi 分区上限 (67108864 字节)"; exit 1; }
          echo "factory 镜像格式与尺寸校验通过"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-nx30pro-66
          path: openwrt/build.log
          if-no-files-found: ignore

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10-mtwifi-nx30pro-66
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-6.6-$(date +%Y%m%d)-${{ github.run_number }}-nx30pro"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "$TAG  H3C NX30 Pro (6.6 / mt_wifi / UPnP / NMBM)" \
            --notes "源码: $SRC_REPO @ $SRC_BRANCH
          源码 commit: $SRC_COMMIT
          feeds commit:
            packages=$FEED_PACKAGES_COMMIT
            luci=$FEED_LUCI_COMMIT
            routing=$FEED_ROUTING_COMMIT
            telephony=$FEED_TELEPHONY_COMMIT
          设备: $DEVICE (MT7981B, 原厂 NMBM 布局)
          内核: 6.6 (24.10)
          无线: MTK 闭源 mt_wifi 7.6.6.1-mt7981 + WARP v2 + HNAT
          插件: 仅追加 UPnP (miniupnpd-nftables, firewall4/nftables)
          主题: 默认 bootstrap-mod（不含 argon）
          构建: $(date -u +'%Y-%m-%d %H:%M UTC')
          校验: CI 已执行 sha256sum -c sha256sums
          注意: 仅适用于原厂 NMBM 布局；OpenWrt U-Boot 布局请另选 h3c_magic-nx30-pro。"
